<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>National Event Request Form</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#f9f9f9; --card:#ffffff; --text-main:#333333; --text-muted:#666666;
    --border:#e5e5e5; --primary:#990000; --primary-2:#7a0000; --accent:#333333;
    --info:#009CA6; --info-2:#007a82; --ok:#009E49; --focus:#2563eb; --radius:6px;
    --pill-audience:#990000; --pill-segments:#009CA6; --pill-collab:#2563eb;
    --pill-rooms:#9333ea; --pill-service:#009CA6; --pill-default:#556070;
    --glass-border:1px solid rgba(255,255,255,0.6); --glass-shadow:0 8px 32px 0 rgba(31,38,135,0.15); --glass-bg-opacity:0.85;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-page:#121212; --card:#1e1e1e; --text-main:#e0e0e0; --text-muted:#a0a0a0;
      --border:#333333; --accent:#e0e0e0;
      --glass-border:1px solid rgba(255,255,255,0.15); --glass-shadow:0 8px 32px 0 rgba(0,0,0,0.5); --glass-bg-opacity:0.30;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg-page);color:var(--text-main);font-family:'Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 24px 60px}
  .top-bar{position:sticky;top:0;z-index:1000;display:flex;align-items:center;flex-wrap:wrap;gap:14px 18px;background:var(--card);border-bottom:4px solid var(--primary);padding:12px 28px;box-shadow:0 2px 8px rgba(0,0,0,.10)}
  .top-bar img{width:150px;max-width:38vw;height:auto;flex:none}
  .top-titles{min-width:0}
  h1{font-size:22px;margin:0;color:var(--accent)}
  .sub{color:var(--text-muted);font-size:13px;margin:2px 0 0}
  .top-region{margin-left:auto;display:flex;flex-direction:column;gap:3px;min-width:240px}
  .top-region .rlabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--primary)}
  .top-region .field{margin:0}
  .top-region .field>label{display:none}
  .top-region .field .help{display:none}
  .pair{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
  @media(max-width:640px){.pair{grid-template-columns:1fr}}
  @media(max-width:520px){
    .top-bar{gap:10px 12px;padding:12px 16px}
    .top-bar img{width:110px}
    .top-region{margin-left:0;width:100%;min-width:0}
    h1{font-size:18px}
    .sub{font-size:12px}
    .wrap{padding:16px 12px 48px}
    .card{padding:16px}
    .section-title{font-size:16px;padding:12px 14px;margin:-16px -16px 16px -16px}
    .intro{padding:12px 14px;font-size:12.5px}
  }
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
  .section-title{font-size:18px;font-weight:700;background:var(--primary);color:#fff;padding:12px 20px;margin:-20px -20px 20px -20px;border-top-left-radius:var(--radius);border-top-right-radius:var(--radius);display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .section-title .emoji{background:rgba(255,255,255,0.2);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 8px rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.2);flex:none}
  .section-title .ttl{flex:1}
  .section-title .chev{font-size:14px;transition:transform .3s;flex:none;opacity:.9}
  .section-title.collapsed .chev{transform:rotate(-90deg)}
  .card-content{transition:max-height .4s ease-out;overflow:visible}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field .req{color:var(--primary)}
  .field .help{font-size:12px;color:var(--text-muted);margin-top:4px}
  input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text-main);font-size:14px;font-family:inherit}
  textarea{min-height:84px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus),transparent 82%)}
  .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
  .chk{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:400;padding:8px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--card)}
  .chk input{margin-top:2px}
  .chk.sel{border-color:var(--focus);background:color-mix(in srgb,var(--focus),transparent 92%)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:620px){.row2{grid-template-columns:1fr}}
  .actions{display:flex;gap:12px;align-items:center;margin-top:8px}
  .btn{border-radius:6px;padding:13px 26px;font-size:13px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;display:inline-flex;align-items:center;gap:8px;border:var(--glass-border);box-shadow:var(--glass-shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all .2s}
  .btn-primary{background:color-mix(in srgb,var(--info),transparent calc(100% - var(--glass-bg-opacity) * 100%));color:#fff}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,0,0,.15);filter:brightness(1.05)}
  .btn-primary:active{transform:translateY(1px);filter:brightness(.96)}
  .btn[disabled]{opacity:.5;cursor:not-allowed;filter:grayscale(1)}
  .err{color:var(--primary);font-size:12px;margin-top:4px;display:none}
  .field.invalid .err{display:block}
  .field.invalid input,.field.invalid select,.field.invalid textarea,.field.invalid .ms-control{border-color:var(--primary)}
  .banner{padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:16px;display:none}
  .banner.show{display:block}
  .banner.error{background:color-mix(in srgb,var(--primary),transparent 88%);color:var(--primary-2);border:1px solid var(--primary)}
  #successPanel{display:none;text-align:center;padding:40px 20px}
  #successPanel .big{font-size:40px}
  #successPanel h2{color:var(--ok)}
  #successPanel a.dash{display:inline-block;margin-top:14px;background:var(--info);color:#fff;padding:12px 22px;border-radius:6px;text-decoration:none;font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-size:13px}
  .spin{display:none;width:18px;height:18px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .intro{background:color-mix(in srgb,var(--focus),transparent 92%);border-left:4px solid var(--focus);border-radius:8px;padding:14px 16px;margin-bottom:18px;font-size:13px;color:var(--text-main)}
  .intro p{margin:0 0 8px}
  .intro ol{margin:6px 0 0;padding-left:20px}
  .intro li{margin-bottom:6px}
  .section-note{font-size:12.5px;color:var(--text-muted);margin:-6px 0 14px}
  .chk-desc{font-size:11px;color:var(--text-muted);margin-top:3px;font-weight:400;line-height:1.35}
  /* two-column compact layout */
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}
  .grid .field.full{grid-column:1 / -1}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  /* multiselect dropdown */
  .ms{position:relative}
  .ms-control{display:flex;align-items:center;flex-wrap:wrap;gap:6px;width:100%;padding:7px 34px 7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text-main);font-size:14px;cursor:pointer;min-height:42px}
  .ms.open .ms-control,.ms:focus .ms-control{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus),transparent 82%)}
  .ms-ph{color:var(--text-muted)}
  .ms-caret{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:11px;transition:transform .15s}
  .ms.open .ms-caret{transform:translateY(-50%) rotate(180deg)}
  .ms-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 10px;border-radius:12px;font-size:11px;font-weight:700;color:#fff;border:var(--glass-border);box-shadow:var(--glass-shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .ms-pill .x{cursor:pointer;font-size:14px;line-height:1;opacity:.85;margin-left:1px}
  .ms-pill .x:hover{opacity:1}
  .pill-audience{background:color-mix(in srgb,var(--pill-audience),transparent calc(100% - var(--glass-bg-opacity) * 100%))}
  .pill-segments{background:color-mix(in srgb,var(--pill-segments),transparent calc(100% - var(--glass-bg-opacity) * 100%))}
  .pill-collab{background:color-mix(in srgb,var(--pill-collab),transparent calc(100% - var(--glass-bg-opacity) * 100%))}
  .pill-rooms{background:color-mix(in srgb,var(--pill-rooms),transparent calc(100% - var(--glass-bg-opacity) * 100%))}
  .pill-service{background:color-mix(in srgb,var(--pill-service),transparent calc(100% - var(--glass-bg-opacity) * 100%))}
  .pill-default{background:color-mix(in srgb,var(--pill-default),transparent calc(100% - var(--glass-bg-opacity) * 100%))}
  .ms-panel{position:absolute;z-index:30;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 22px rgba(0,0,0,.14);max-height:280px;overflow:auto;padding:6px}
  .ms-search{width:100%;margin-bottom:6px;padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text-main);font-size:13px}
  .ms-opt{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:6px;font-size:13px;cursor:pointer}
  .ms-opt:hover{background:color-mix(in srgb,var(--focus),transparent 92%)}
  .ms-opt input{margin-top:2px;flex:none}
  .ms-empty{padding:10px 8px;font-size:12.5px;color:var(--text-muted)}
</style>
</head>
<body>
<header class="top-bar">
  <picture>
    <source srcset="light-logo.png" media="(prefers-color-scheme: dark)">
    <img src="dark-logo.png" alt="the Ismaili Canada" onerror="this.style.display='none'">
  </picture>
  <div class="top-titles">
    <h1 id="formTitle">National Event Request Form</h1>
    <div class="sub" id="formSub">Submit a new event request for review and approval.</div>
  </div>
  <div class="top-region" id="regionSlot"></div>
</header>
<div class="wrap">

  <div class="banner error" id="errorBanner"></div>
  <form id="eventForm" novalidate></form>

  <div id="successPanel">
    <div class="big">✅</div>
    <h2>Request submitted</h2>
    <p id="successMsg" style="color:var(--text-muted)"></p>
    <a class="dash" id="dashLink" href="#" target="_blank" rel="noopener">Open the Event Dashboard</a>
  </div>
</div>

<script>
/* ============================================================================
   1) SETTINGS
   ============================================================================ */
const FLOW_URL = "https://default98d027077ed646d2acf222ebdd2d5c.17.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/02/workflows/296063f569bc4eaf87cd4fa3e2d43cbb/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=i5srnnoXynkkmhK4IAlXhocTgvp_-tOHucExE59nBmY";
const DASHBOARD_URL = "https://default98d027077ed646d2acf222ebdd2d5c.17.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/26/workflows/4dc26a4bca92432bb847c47860e3667f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=qlK5yTiztt4951SYCmr6KoomyqGe1HX5y1XWguGpyIA";
const TIME_STEP = 15; // minutes between time options (set 30 for half-hour only)

/* ============================================================================
   2) OPTION LISTS  (values are what the flow stores — must match Region Config / SharePoint)
   ============================================================================ */
// region value MUST equal the Title in your Region Config list:
const REGIONS = [
  { label:"All Canada", value:"All Canada" },
  { label:"British Columbia", value:"British Columbia" },
  { label:"Edmonton", value:"Edmonton" },
  { label:"Toronto", value:"Toronto" },
  { label:"Southwest Ontario", value:"Southwest Ontario" },
  { label:"Northeast Ontario", value:"Northeast Ontario" },
  { label:"All Ontario", value:"All Ontario" },
  { label:"Prairies", value:"Prairies" },
  { label:"Quebec and Maritimes", value:"Quebec and Maritimes" }
];
const SWO = "Southwest Ontario";

// Region-specific intro shown once a Region is selected. Add other regions' text as needed.
const REGION_INTRO = {
  "British Columbia": `<p>Use this form to submit event requests to be Approved and added to the <strong>BC Institutional Calendar (BIC)</strong>. Please ensure that the event has been submitted a minimum of <strong>eight (8) weeks</strong> prior to the date of your event. This will allow the collaborating Board/Portfolios to provide the required support for the event in a timely manner.</p>
  <p>The approval process is as follows:</p>
  <ol>
    <li>Check the calendar ahead of submission for any location, time or target segment conflicts. Please try to resolve any conflicts with Boards/Portfolios ahead of submission, if possible.</li>
    <li>Submit your event using this form. This will generate an approval workflow to your Board/Portfolio Chair for Primary Approval, followed by Council for BC Honorary Secretary and/or ITREB for BC Honorary Secretary for Final Approval.</li>
    <li>If your event is approved, you will receive a confirmation email and it will be added to the BIC. You can then proceed with planning your event.</li>
    <li>If your event is not approved, you will receive an email with a comment explaining why the event was rejected. Once you have resolved this, you may resubmit a new request. If you need to add information regarding the resolution of the conflict or issue, use the 'Notes on Conflicts' field in the form.</li>
    <li>If you are submitting a placeholder for your event, please put the word <strong>HOLD</strong> in the title so that others are aware this booking is tentative and may change.</li>
  </ol>`,
  "Southwest Ontario": `<p>Use this form to submit event requests to be Approved and added to the <strong>Council for Southwest Ontario Institutional Calendar (SWIC)</strong>. Please ensure that the event has been submitted a minimum of <strong>six (6) weeks</strong> prior to the date of your event. This will allow the collaborating Board/Portfolios to provide the required support for the event in a timely manner.</p>
  <p>The approval process is as follows:</p>
  <ol>
    <li>Check the calendar ahead of submission for any location, time or target segment conflicts. Please try to resolve any conflicts with Boards/Portfolios ahead of submission, if possible.</li>
    <li>Submit your event using this form. This will generate an approval workflow for Primary Approval, followed by Final Approval by the Institutional Delivery Excellence (IDE) Program Team.</li>
    <li>If your event is approved, you will receive a confirmation email and it will be added to the SWIC. You can then proceed with planning your event.</li>
    <li>If your event is not approved, you will receive an email with a comment explaining why the event was rejected. Once you have resolved this, you may resubmit a new request. If you need to add information regarding the resolution of the conflict or issue, use the 'Notes on Conflicts' field in the form.</li>
    <li>If you are submitting a placeholder for your event, please put the word <strong>HOLD</strong> in the title so that others are aware this booking is tentative and may change.</li>
  </ol>`
};

const BOARDS = [
  "Arts & Culture","ACCESS","Care for the Elderly (CFTE)","Communications & Publications","Community Assets",
  "Community Services (Rites of Passage)","Conciliation & Arbitration Board (CAB)","Council for the Prairies",
  "Data Management & Technology","Aga Khan Economic Planning Board (EPB)","Aga Khan Education Board","External Relations",
  "Financial Resource Development","Future Ready Initiative","Grants & Review Board (GRB)","Aga Khan Health Board",
  "Institutional Delivery Excellence","Ismaili Tariqah & Religious Education Board (ITREB)","Jamati MKMKs","Legal Matters",
  "Property Matters","Settlement","Aga Khan Social Welfare Board (SWB)","Volunteer Management",
  "Aga Khan Youth & Sports Board (YSB)","Equity Diversity Inclusion & Belonging","Aga Khan Development Network (AKDN)",
  "Aga Khan Foundation Canada (AKFC)","Aga Khan Museum (AKM)","Focus Canada","Global Encounters",
  "Global Centre for Pluralism (GCP)","World Partnership Golf","World Partnership Walk","Council for Canada"
];
const B_ITREB = "Ismaili Tariqah & Religious Education Board (ITREB)";
const B_YSB   = "Aga Khan Youth & Sports Board (YSB)";
// Boards that show NO Area of Focus / Objective:
const BOARDS_NO_AOF = ["Conciliation & Arbitration Board (CAB)","Grants & Review Board (GRB)","ACCESS"];

const AOF_ITREB = ["Adult Education","BUI Early Childhood Development (ECD)","BUI Primary","BUI Secondary","Jamati Activities","Waezeen","Other"];
const AOF_YSB   = ["Camps","Ismaili CIVIC","Positive Youth Development","Sports","Youth"];
const AOF_OTHER = ["Adult Education","BUI Early Childhood Development (ECD)","BUI Primary","BUI Secondary","Jamati Activities","Waezeen","Camps","Ismaili CIVIC","Positive Youth Development","Sports","Youth","Other"];
// NOTE: single Objective list for now. If you want objectives filtered by Area of Focus (as in Drupal),
// send me the per-area objective sub-lists and I'll wire objectivesBy(area).
const OBJECTIVES = [
  "Strengthen Ismaili identity (YSB) - Young Adult",
  "Strengthen Ismaili identity (YSB) - Youth",
  "Increase access to religious education for Adults 18+",
  "Increase access to religious education for ages 4-18 (BUI, ERP)",
  "Enhance the quality of religious education via teacher training and development",
  "All Ismaili youth will have the skills to be leaders in their discipline, within and outside the Shia Imami Ismaili community",
  "Support and contribute to the development of resilient youth",
  "All Ismaili youth will have a strong sense of identity, be able to articulate the values of and be ambassadors of the Shia Imami Ismaili community",
  "All Ismaili youth will feel a sense of belonging within the Shia Imami Ismaili community",
  "The Canadian Jamat will be healthy and active through their participation in organized/life sports and physical activity",
  "Expand and strengthen sustainable integrated coordinated programming",
  "Parental engagement",
  "Training and religious education to Jamati Leadership"
];

// Per-region event-location lists:
const LOC_SWO = ["All Jamatkhanas","Brantford","Brampton","Guelph","Halton","Hamilton","Kitchener–Headquarters","London","Meadowvale","Mississauga","NiagaraFalls","Windsor","Other"];
const LOC_BC  = ["Ismaili Centre Vancouver Jamatkhana (Darkhana)","Headquarters Vancouver Jamatkhana","Richmond Jamatkhana","Burnaby Lake Jamatkhana","Tri-City Jamatkhana","Fraser Valley Jamatkhana","Downtown Jamatkhana","Other"];
const LOC_PRAIRIES = ["Headquarters","Franklin","Northwest","South","Westwinds","Generations","All Calgary Jamatkhanas","External venue"];
function locationsFor(region){
  if(region===SWO) return LOC_SWO;
  if(region==="British Columbia") return LOC_BC;
  if(region==="Prairies") return LOC_PRAIRIES;
  return ["Other"]; // add other regions' lists here as needed
}

const ATTENDEES = ["0 - 25","26 - 50","51 - 100","101 - 200","201 - 499","500+"];
const AUDIENCE = ["Jamat","Leadership","Ummah","External","Government","Other"];
const TARGET_SEGMENTS = ["Early Childhood Development (ECD) (0-4 yrs)","Young (5-11 yrs)","Youth (12-17 yrs)","Post Secondary (18-25 yrs)","Young Adults (25-35 yrs)","Adults (35-54 yrs)","Seniors (55+ yrs)","All"];
const SERVICES = [
  { label:"Arts & Culture", value:"Arts & Culture", desc:"Music, Bands, Performance Arts, Visual Arts, etc." },
  { label:"Communications", value:"Communications", desc:"Announcements, Communication & Marketing Plans, Digital Communications (iiCanada, Digital Al-Akhbar (DAA), Social Media, JamatKhana eBoards), Photos, Videos, Event Registration & Ticket Sales, etc." },
  { label:"Legal", value:"Legal", desc:"Waivers, Contracts, etc." },
  { label:"Audio Visual", value:"Audio Visual", desc:"Audio Visuals, Microphones, Speakers, Projector, Live Stream, etc." },
  { label:"Transportation", value:"Transportation", desc:"Material or People Transportation (Bus/Shuttle)." },
  { label:"Volunteer Management", value:"Volunteer Management", desc:"Event Resources (Setup, Takedown, Service, Food, Security, People Resources, etc.)." }
];
const EVENT_TYPES = ["Meeting","New Event","Program"];
const EVENT_LEADS = ["Requester is the Project Lead and Day Lead","Requester is the Project Lead, but the Day Lead is someone else","Project Lead and Day Leads are someone else"];
const EL_DPD = "Project Lead and Day Leads are someone else";
const EL_DDL = "Requester is the Project Lead, but the Day Lead is someone else";

/* ============================================================================
   3) FORM DEFINITION  (key = FormResponse key the flow expects)
   ============================================================================ */
const SECTIONS = [
  { title:"📅 Calendar Details", note:"This information is used to create the Institutional Calendar entry and room booking for your event.", fields:[
    { key:"Region", label:"Region", type:"select", required:true, options:REGIONS },
    { key:"Event Title", label:"Event Title", type:"text", required:true, full:true, help:"For a tentative booking, start the title with the word HOLD." },
    // Event Type is shown for all regions EXCEPT SWO (matches Drupal conditional):
    { key:"Event Type", label:"Event Type", type:"select", options:EVENT_TYPES, full:true,
      showIf:v=> v["Region"] && v["Region"]!==SWO },
    { key:"Event Description", label:"Event Description", type:"textarea", required:true },
    { key:"Event Start Date", label:"Event Start Date", type:"date", required:true, full:true },
    { key:"Start Time", label:"Start Time", type:"time", required:true, half:true, help:"Include the setup time you'll need." },
    { key:"End Time", label:"End Time", type:"time", required:true, half:true, help:"Include the takedown/cleanup time you'll need." },
    { key:"Recurring Event", label:"Is this a recurring event?", type:"select", required:true,
      options:["None","Daily","Weekly","Bi-Weekly","Monthly"] },
    { key:"Number Of Repeat Occurrences", label:"Number of Repeat Occurrences", type:"number", min:1, required:true,
      help:"How many times the event repeats (a number).",
      showIf:v=> v["Recurring Event"] && v["Recurring Event"]!=="None" },
    { key:"Virtual Event", label:"Will your event take place virtually?", type:"select", required:true,
      options:["No","Yes"] },
    { key:"Event Location", label:"Event Location", type:"multiselect", required:true, join:" - ", pill:"pill-rooms",
      help:"Select one or more locations.",
      optionsBy:v=> locationsFor(v["Region"]),
      showIf:v=> v["Virtual Event"]!=="Yes" },
    { key:"Venue Name", label:"Venue Name", type:"text", required:true, full:true,
      showIf:v=> v["Virtual Event"]!=="Yes" && Array.isArray(v["Event Location"]) && v["Event Location"].indexOf("Other")!==-1 },
    { key:"Venue Address", label:"Venue Address", type:"textarea", required:true,
      showIf:v=> v["Virtual Event"]!=="Yes" && Array.isArray(v["Event Location"]) && v["Event Location"].indexOf("Other")!==-1 },
    { key:"Notes on Conflicts", label:"Notes on Conflicts", type:"textarea",
      help:"Optional — if you had conflicts and resolved them, add notes for the approvers (e.g. \"resolved conflict with Board X for Event Y, please delete event Z\")." }
  ]},
  { title:"🎯 Event Details", fields:[
    { key:"Responsible Board", label:"Responsible Board / Portfolio", type:"select", required:true, options:BOARDS },
    { key:"Area of Focus", label:"Area of Focus", type:"select", required:true,
      help:"Enter the area of focus / sub-team for your Board/Portfolio.",
      optionsBy:v=> v["Responsible Board"]===B_ITREB ? AOF_ITREB : (v["Responsible Board"]===B_YSB ? AOF_YSB : AOF_OTHER),
      showIf:v=> v["Responsible Board"] && BOARDS_NO_AOF.indexOf(v["Responsible Board"])===-1 },
    { key:"Objective", label:"Objective", type:"select", required:true, options:OBJECTIVES, full:true,
      help:"The objective of this event for your Board/Portfolio.",
      showIf:v=> v["Responsible Board"] && BOARDS_NO_AOF.indexOf(v["Responsible Board"])===-1 },
    { key:"Audience", label:"Audience", type:"multiselect", required:true, options:AUDIENCE, pill:"pill-audience" },
    // Target Segments only when Audience includes "Jamat":
    { key:"Target Segments", label:"Target Segments", type:"multiselect", required:true, options:TARGET_SEGMENTS, pill:"pill-segments",
      showIf:v=> Array.isArray(v["Audience"]) && v["Audience"].indexOf("Jamat")!==-1 },
    { key:"Collaborating Boards", label:"Collaborating Boards / Portfolios", type:"multiselect", options:BOARDS, pill:"pill-collab" },
    { key:"Services needed", label:"Services Needed", type:"multiselect", required:true, options:SERVICES, pill:"pill-service",
      help:"Select all the services you'll require for your event." },
    { key:"Expected Number of Attendees", label:"Expected Number of Attendees", type:"select", required:true, options:ATTENDEES },
    // ---- SWO-only fields (shown only when Region = Southwest Ontario) ----
    { key:"Serving Refreshments", label:"Are you serving refreshments?", type:"select", required:true, options:["No","Yes"], full:true,
      showIf:v=> v["Region"]===SWO },
    { key:"Refreshment Details", label:"Refreshment Details", type:"textarea", required:true,
      showIf:v=> v["Region"]===SWO && v["Serving Refreshments"]==="Yes" },
    { key:"Ticketed Event", label:"Does your event have tickets?", type:"select", required:true, options:["No","Yes","Yes (Subsidized)"],
      showIf:v=> v["Region"]===SWO },
    { key:"Ticket Price", label:"Ticket Price", type:"text", required:true,
      showIf:v=> v["Region"]===SWO && (v["Ticketed Event"]==="Yes" || v["Ticketed Event"]==="Yes (Subsidized)") },
    { key:"Has Budget", label:"Do you have budget for the event?", type:"select", required:true, options:["No","Yes"], full:true,
      showIf:v=> v["Region"]===SWO },
    { key:"Cost Breakdown", label:"Please provide a cost breakdown for the event", type:"textarea", required:true,
      showIf:v=> v["Region"]===SWO && v["Has Budget"]==="Yes" }
  ]},
  { title:"👤 Contact Details", note:"This information is used for the Institutional Calendar entry and event coordination.", fields:[
    { key:"Name", label:"Your Name", type:"text", required:true, half:true },
    { key:"Email Address", label:"Your Email", type:"email", required:true, validate:"email", half:true },
    { key:"Phone Number", label:"Your Phone", type:"tel", required:true, validate:"phone", half:true },
    { key:"Event Leads", label:"Event Leads", type:"select", required:true, options:EVENT_LEADS },
    // Project Lead: only when "Project Lead and Day Leads are someone else"
    { key:"Project Lead Name", label:"Project Lead Name", type:"text", required:true, half:true,
      showIf:v=> v["Event Leads"]===EL_DPD },
    { key:"Project Lead Email", label:"Project Lead Email", type:"email", required:true, validate:"email", half:true,
      showIf:v=> v["Event Leads"]===EL_DPD },
    { key:"Project Lead Phone", label:"Project Lead Phone", type:"tel", validate:"phone", half:true,
      showIf:v=> v["Event Leads"]===EL_DPD },
    // Day-of Lead: when day lead is someone else (both "ddl" and "dpd")
    { key:"Day of Event Lead Name", label:"Day-of Lead Name", type:"text", required:true, half:true,
      showIf:v=> v["Event Leads"]===EL_DDL || v["Event Leads"]===EL_DPD },
    { key:"Day of Event Lead Email", label:"Day-of Lead Email", type:"email", required:true, validate:"email", half:true,
      showIf:v=> v["Event Leads"]===EL_DDL || v["Event Leads"]===EL_DPD },
    { key:"Day of Event Lead Phone", label:"Day-of Lead Phone", type:"tel", validate:"phone", half:true,
      showIf:v=> v["Event Leads"]===EL_DDL || v["Event Leads"]===EL_DPD }
  ]}
];
const ARRAY_KEYS = ["Room Booking","Audience","Target Segments","Collaborating Boards","Services needed"];

/* ============================================================================
   4) ENGINE
   ============================================================================ */
const q = new URLSearchParams(location.search);
const EDIT_ID = q.get('eid') || q.get('eventid') || '';
const PRESET_REGION = q.get('region') || q.get('r') || '';
const form = document.getElementById('eventForm');
const values = {};
const fieldEls = {};
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function el(tag, attrs, html){ const e=document.createElement(tag); if(attrs) for(const k in attrs) e.setAttribute(k,attrs[k]); if(html!=null) e.innerHTML=html; return e; }
function closeAllMs(){ document.querySelectorAll('.ms.open').forEach(m=>{ m.classList.remove('open'); const p=m.querySelector('.ms-panel'); if(p) p.hidden=true; }); }
document.addEventListener('click', (e)=>{ if(!e.target.closest('.ms')) closeAllMs(); });
function toggleCard(header){
  const content = header.nextElementSibling;
  if(!content) return;
  if(!content.style.maxHeight){
    // open -> close
    content.style.overflow='hidden';
    content.style.maxHeight = content.scrollHeight + 'px';
    content.offsetHeight; // reflow
    content.style.maxHeight = '0px';
    header.classList.add('collapsed');
  } else {
    // closed -> open
    content.style.overflow='hidden';
    content.style.maxHeight = content.scrollHeight + 'px';
    header.classList.remove('collapsed');
    setTimeout(()=>{ if(!header.classList.contains('collapsed')){ content.style.maxHeight = null; content.style.overflow='visible'; } }, 400);
  }
}
const norm = o => (typeof o==='string' ? {label:o, value:o} : o);
function buildTimeOptions(){ const out=[]; for(let h=0;h<24;h++){ for(let m=0;m<60;m+=TIME_STEP){ const ap=h>=12?'pm':'am'; let h12=h%12; if(h12===0)h12=12; out.push(h12+':'+String(m).padStart(2,'0')+' '+ap); } } return out; }
const TIME_OPTIONS = buildTimeOptions();
function validPhone(s){ const d=String(s||'').replace(/\D/g,''); return /^1?\d{10}$/.test(d); }

function buildField(def){
  const wrap = el('div',{class:'field','data-key':def.key});
  const id = 'f_'+def.key.replace(/[^a-z0-9]/gi,'_');
  wrap.appendChild(el('label',{for:id}, def.label + (def.required?' <span class="req">*</span>':'')));
  let rebuild = null, setFn = null;

  if(def.type==='select' || def.type==='time'){
    const s = el('select',{id});
    const getOpts = ()=> def.type==='time' ? TIME_OPTIONS : (def.optionsBy ? def.optionsBy(values) : (def.options||[]));
    const fill = ()=>{
      const cur = values[def.key]||'';
      s.innerHTML=''; s.appendChild(el('option',{value:''},'— Select —'));
      const list = getOpts().map(norm);
      list.forEach(o=> s.appendChild(el('option',{value:o.value}, o.label)));
      if(list.some(o=>o.value===cur)){ s.value=cur; } else { s.value=''; values[def.key]=''; }
    };
    fill();
    s.addEventListener('change',()=>{ values[def.key]=s.value; onChange(); });
    if(def.optionsBy) rebuild = fill;
    setFn = (val)=>{ val = val==null?'':String(val); values[def.key]=val;
      if(val && !Array.prototype.some.call(s.options, o=>o.value===val)) s.appendChild(el('option',{value:val}, val));
      s.value = val; };
    wrap.appendChild(s);
  } else if(def.type==='multiselect'){
    if(!Array.isArray(values[def.key])) values[def.key]=[];
    const ms = el('div',{class:'ms',tabindex:'0'});
    const control = el('div',{class:'ms-control'});
    const caret = el('span',{class:'ms-caret'},'▾');
    const panel = el('div',{class:'ms-panel'}); panel.hidden=true;
    ms.appendChild(control); ms.appendChild(panel);
    let searchInp=null;
    const pillClass = def.pill || 'pill-default';
    const getOpts = ()=> (def.optionsBy ? def.optionsBy(values) : (def.options||[])).map(norm);
    const renderControl = ()=>{
      const opts=getOpts(), sel=values[def.key]||[];
      control.innerHTML='';
      if(sel.length===0){ control.appendChild(el('span',{class:'ms-ph'},'— Select —')); }
      else {
        sel.forEach(v=>{
          const o=opts.find(x=>x.value===v); const label=o?o.label:v;
          const pill=el('span',{class:'ms-pill '+pillClass});
          pill.appendChild(document.createTextNode(label));
          const x=el('span',{class:'x'}); x.innerHTML='&times;';
          x.addEventListener('click',(e)=>{ e.stopPropagation();
            values[def.key]=(values[def.key]||[]).filter(z=>z!==v);
            const box=Array.prototype.find.call(panel.querySelectorAll('input[type=checkbox]'), b=>b.value===v); if(box) box.checked=false;
            renderControl(); onChange();
          });
          pill.appendChild(x);
          control.appendChild(pill);
        });
      }
      control.appendChild(caret);
    };
    const buildPanel = ()=>{
      const opts=getOpts();
      values[def.key] = (values[def.key]||[]).filter(v=> opts.some(o=>o.value===v)); // drop invalid
      panel.innerHTML='';
      if(opts.length>8){
        searchInp = el('input',{class:'ms-search',type:'text',placeholder:'Search…'});
        searchInp.addEventListener('click',e=>e.stopPropagation());
        searchInp.addEventListener('input',()=>{ const q=searchInp.value.toLowerCase();
          panel.querySelectorAll('.ms-opt').forEach(o=>{ o.hidden = o.getAttribute('data-label').indexOf(q)===-1; }); });
        panel.appendChild(searchInp);
      }
      opts.forEach(o=>{
        const lab = el('label',{class:'ms-opt','data-label':o.label.toLowerCase()});
        const cb = el('input',{type:'checkbox',value:o.value});
        if(values[def.key].indexOf(o.value)!==-1) cb.checked=true;
        cb.addEventListener('change',()=>{
          const arr=values[def.key];
          if(cb.checked){ if(arr.indexOf(o.value)===-1) arr.push(o.value); }
          else { values[def.key]=arr.filter(x=>x!==o.value); }
          renderControl(); onChange();
        });
        lab.appendChild(cb);
        const txt=el('div'); txt.appendChild(document.createTextNode(o.label));
        if(o.desc) txt.appendChild(el('div',{class:'chk-desc'}, o.desc));
        lab.appendChild(txt);
        panel.appendChild(lab);
      });
      if(!opts.length) panel.appendChild(el('div',{class:'ms-empty'},'No options available.'));
      renderControl();
    };
    buildPanel();
    control.addEventListener('click',(e)=>{ e.stopPropagation();
      const willOpen = panel.hidden; closeAllMs();
      if(willOpen){ panel.hidden=false; ms.classList.add('open');
        if(searchInp){ searchInp.value=''; searchInp.dispatchEvent(new Event('input')); searchInp.focus(); } }
    });
    if(def.optionsBy) rebuild = buildPanel;
    setFn = (arr)=>{ values[def.key] = Array.isArray(arr)? arr.map(String) : []; buildPanel(); };
    wrap.appendChild(ms);
  } else if(def.type==='textarea'){
    const t = el('textarea',{id});
    t.addEventListener('input',()=>{ values[def.key]=t.value; });
    setFn = (val)=>{ val = val==null?'':String(val); values[def.key]=val; t.value=val; };
    wrap.appendChild(t);
  } else {
    const inp = el('input',{id,type:def.type||'text'});
    if(def.type==='number' && def.min!=null) inp.setAttribute('min', def.min);
    inp.addEventListener('input',()=>{ values[def.key]=inp.value; });
    setFn = (val)=>{ val = val==null?'':String(val); values[def.key]=val; inp.value=val; };
    wrap.appendChild(inp);
  }
  wrap.appendChild(el('div',{class:'err'},'This field is required.'));
  if(def.help) wrap.appendChild(el('div',{class:'help'}, def.help));
  fieldEls[def.key]={wrap, def, rebuild, set:setFn};
  return wrap;
}

function renderForm(){
  form.appendChild(el('div',{class:'intro',id:'regionIntro',hidden:'hidden'}));
  SECTIONS.forEach(sec=>{
    const card = el('div',{class:'card'});
    const sp = sec.title.split(' ');
    const emoji = sp[0]; const ttl = sp.slice(1).join(' ');
    const head = el('h2',{class:'section-title'});
    head.appendChild(el('span',{class:'emoji'}, emoji));
    head.appendChild(el('span',{class:'ttl'}, ttl));
    head.appendChild(el('span',{class:'chev'}, '▾'));
    head.addEventListener('click', ()=> toggleCard(head));
    card.appendChild(head);
    const content = el('div',{class:'card-content'});
    if(sec.note) content.appendChild(el('div',{class:'section-note'}, sec.note));
    const container = el('div',{class:'fields'});
    let buf=[];
    const flushPair=()=>{ if(buf.length){ const pr=el('div',{class:'pair'}); buf.forEach(w=>pr.appendChild(w)); container.appendChild(pr); buf=[]; } };
    sec.fields.forEach(def=>{
      // Region lives in the sticky header, not in a section
      if(def.key==='Region'){
        const slot=document.getElementById('regionSlot');
        slot.appendChild(el('span',{class:'rlabel'},'Region'));
        const rw=buildField(def); rw.classList.add('region-field'); slot.appendChild(rw);
        return;
      }
      const w = buildField(def);
      const isFull = def.type==='textarea' || def.full;
      if(isFull){ flushPair(); w.classList.add('full-block'); container.appendChild(w); }
      else { buf.push(w); if(buf.length===2) flushPair(); }
    });
    flushPair();
    content.appendChild(container);
    card.appendChild(content);
    form.appendChild(card);
  });
  const act = el('div',{class:'actions'});
  act.appendChild(el('button',{type:'submit',class:'btn btn-primary',id:'submitBtn'}, EDIT_ID?'Save Changes':'Submit Request'));
  act.appendChild(el('div',{class:'spin',id:'spin'}));
  form.appendChild(act);
}

function visible(def){
  if(def.regions && def.regions.indexOf(values["Region"])===-1) return false;
  if(def.showIf && !def.showIf(values)) return false;
  return true;
}
function updateRegionIntro(){
  const box = document.getElementById('regionIntro'); if(!box) return;
  const t = REGION_INTRO[values["Region"]];
  if(t){ box.innerHTML = t; box.hidden = false; } else { box.innerHTML=''; box.hidden = true; }
}
function onChange(){
  for(const key in fieldEls){ if(fieldEls[key].rebuild) fieldEls[key].rebuild(); }
  for(const key in fieldEls){ fieldEls[key].wrap.hidden = !visible(fieldEls[key].def); }
  // collapse pair rows where both fields are hidden (avoids empty gaps)
  document.querySelectorAll('.pair').forEach(pr=>{
    pr.hidden = Array.prototype.every.call(pr.children, c=>c.hidden);
  });
  updateRegionIntro();
}

function setErr(wrap, msg){ wrap.classList.add('invalid'); const e=wrap.querySelector('.err'); if(e&&msg) e.textContent=msg; }
function validate(){
  let ok=true, first=null;
  for(const key in fieldEls){
    const {wrap,def}=fieldEls[key];
    wrap.classList.remove('invalid');
    if(wrap.hidden) continue;
    const v = values[key];
    const empty = Array.isArray(v)? v.length===0 : !String(v==null?'':v).trim();
    if(def.required && empty){ setErr(wrap,'This field is required.'); ok=false; first=first||wrap; continue; }
    if(!empty && def.validate==='email' && !EMAIL_RE.test(String(v).trim())){ setErr(wrap,'Enter a valid email address.'); ok=false; first=first||wrap; continue; }
    if(!empty && def.validate==='phone' && !validPhone(v)){ setErr(wrap,'Enter a valid North American phone number (10 digits).'); ok=false; first=first||wrap; continue; }
    if(!empty && def.type==='number' && def.min!=null && Number(v)<def.min){ setErr(wrap,'Value must be at least '+def.min+'.'); ok=false; first=first||wrap; continue; }
  }
  if(first) first.scrollIntoView({behavior:'smooth',block:'center'});
  return ok;
}

function buildPayload(){
  const fr = { "Event Id": EDIT_ID || "", "Id": EDIT_ID? parseInt(EDIT_ID,10):0 };
  for(const key in fieldEls){
    const {wrap,def}=fieldEls[key];
    let v = values[key];
    if(wrap.hidden){ v = (def.type==='multiselect')? [] : ''; }
    if(def.type==='multiselect'){ const a = Array.isArray(v)? v : []; fr[key] = def.join ? a.join(def.join) : a; }
    else { fr[key] = v==null? '' : String(v); }
  }
  ARRAY_KEYS.forEach(k=>{ if(!(k in fr)) fr[k]=[]; });
  return { FormResponse: fr };
}

async function submit(e){
  e.preventDefault();
  document.getElementById('errorBanner').classList.remove('show');
  if(!validate()){ showError('Please fix the highlighted fields.'); return; }
  if(FLOW_URL.indexOf('http')!==0){ showError('Form endpoint not configured yet — set FLOW_URL in index.html.'); return; }
  const btn=document.getElementById('submitBtn'), spin=document.getElementById('spin');
  btn.disabled=true; spin.style.display='inline-block';
  try{
    const r = await fetch(FLOW_URL, { method:'POST', body: JSON.stringify(buildPayload()) }); // text/plain => no CORS preflight
    const txt = await r.text();
    let data={}; try{ data=JSON.parse(txt); }catch(_){}
    if(!r.ok) throw new Error('HTTP '+r.status+' '+txt.slice(0,200));
    showSuccess(data);
  }catch(err){ showError('Could not submit: '+err.message); btn.disabled=false; spin.style.display='none'; }
}

function showError(msg){ const b=document.getElementById('errorBanner'); b.textContent=msg; b.classList.add('show'); window.scrollTo({top:0,behavior:'smooth'}); }
function showSuccess(data){
  form.style.display='none';
  const sp=document.getElementById('successPanel'); sp.style.display='block';
  document.getElementById('successMsg').textContent = data.eventId ? ('Your request has been received (Event #'+data.eventId+') and is now in the approval workflow.') : 'Your request has been received and is now in the approval workflow.';
  const link=document.getElementById('dashLink');
  if(data.dashboardUrl){ link.href=data.dashboardUrl; } else { link.style.display='none'; }
  window.scrollTo({top:0,behavior:'smooth'});
}

// ---- edit prefill (fetch existing event from the Dashboard flow) ----
function dec(v){ if(v==null) return ''; try{ return decodeURIComponent(String(v)).replace(/\+/g,' '); }catch(e){ return String(v); } }
function splitDelimited(s){ s=dec(s).replace(/^[-–—]\s*/,''); var p=s.split(/\s+[-–—]\s+/).map(x=>x.trim()).filter(Boolean); return p.length?p:(s?[s]:[]); }
function parseMulti(data){ if(data==null||data===''||data==='[]') return []; try{ var p=typeof data==='string'?JSON.parse(data):data; if(Array.isArray(p)){ var out=[]; p.forEach(it=>{ out=out.concat(splitDelimited(it&&it.Value!=null?it.Value:it)); }); return out; } }catch(e){} return splitDelimited(data); }
// dashboard eventData key -> {form key, decode?, kind}
const PREFILL_MAP = {
  "Event Title":{k:"Event Title",dec:1}, "Event Type":{k:"Event Type"}, "Event Description":{k:"Event Description",dec:1},
  "Event Start Date":{k:"Event Start Date",date:1}, "Start Time":{k:"Start Time",time:1}, "End Time":{k:"End Time",time:1},
  "Recurring Event":{k:"Recurring Event"}, "Repeat Occurrences":{k:"Number Of Repeat Occurrences"}, "Virtually":{k:"Virtual Event"},
  "Location":{k:"Event Location",multi:1}, "Venue Name":{k:"Venue Name",dec:1}, "Venue Address":{k:"Venue Address",dec:1},
  "Notes on Conflict":{k:"Notes on Conflicts",dec:1}, "Board Portfolio":{k:"Responsible Board"},
  "Area of Focus":{k:"Area of Focus",dec:1}, "Objective":{k:"Objective",dec:1},
  "Collaborating Boards":{k:"Collaborating Boards",multi:1}, "Audience":{k:"Audience",multi:1},
  "Target Segments":{k:"Target Segments",multi:1}, "Services Required":{k:"Services needed",multi:1},
  "Room Booking":{k:"Room Booking",multi:1}, "Expected Attendees":{k:"Expected Number of Attendees"},
  "Requester Name":{k:"Name",dec:1}, "Requester Email":{k:"Email Address",dec:1}, "Requester Phone":{k:"Phone Number",dec:1},
  "Event Leads Summary":{k:"Event Leads",dec:1},
  "Project Lead Name":{k:"Project Lead Name",dec:1}, "Project Lead Email":{k:"Project Lead Email",dec:1}, "Project Lead Phone":{k:"Project Lead Phone",dec:1},
  "Day Lead Name":{k:"Day of Event Lead Name",dec:1}, "Day Lead Email":{k:"Day of Event Lead Email",dec:1}, "Day Lead Phone":{k:"Day of Event Lead Phone",dec:1},
  "Serving Refreshments":{k:"Serving Refreshments"}, "Refreshment Details":{k:"Refreshment Details",dec:1},
  "Ticketed Event":{k:"Ticketed Event"}, "Ticket Price":{k:"Ticket Price",dec:1},
  "Has Budget":{k:"Has Budget"}, "Cost Breakdown":{k:"Cost Breakdown",dec:1}
};
function setField(k,val){ const fe=fieldEls[k]; if(fe && fe.set) fe.set(val); }
async function prefillFromDashboard(){
  if(DASHBOARD_URL.indexOf('http')!==0){ showError('Cannot load event for editing — DASHBOARD_URL is not set in the form.'); return; }
  const btn=document.getElementById('submitBtn'); if(btn){ btn.disabled=true; btn.textContent='Loading…'; }
  try{
    const sep=DASHBOARD_URL.indexOf('?')>-1?'&':'?';
    const url=DASHBOARD_URL+sep+'eventid='+encodeURIComponent(EDIT_ID)+'&region='+encodeURIComponent(PRESET_REGION);
    const r=await fetch(url); if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json(); const ev=data.eventData||{};
    if(PRESET_REGION) setField("Region", PRESET_REGION);
    for(const src in PREFILL_MAP){ if(ev[src]==null) continue; const m=PREFILL_MAP[src]; if(!fieldEls[m.k]) continue;
      let val=ev[src];
      if(m.multi){ val=parseMulti(val); }
      else if(m.single){ val=parseMulti(val)[0]||''; }
      else { val=m.dec?dec(val):String(val); if(m.date){ const mm=String(val).match(/^\d{4}-\d{2}-\d{2}/); val=mm?mm[0]:val; } if(m.time){ val=String(val).trim().toLowerCase(); } }
      setField(m.k, val);
    }
    onChange();
    if(btn){ btn.disabled=false; btn.textContent='Save Changes'; }
  }catch(e){ showError('Could not load event #'+EDIT_ID+' for editing: '+e.message); if(btn){ btn.disabled=false; btn.textContent='Save Changes'; } }
}

renderForm();
if(EDIT_ID){ document.getElementById('formTitle').textContent='Edit Event Request';
  document.getElementById('formSub').textContent='Editing event #'+EDIT_ID+'. Material changes (date, time, location, etc.) will re-enter approval.'; }
if(PRESET_REGION){ setField("Region", PRESET_REGION); }
onChange();
form.addEventListener('submit', submit);
if(EDIT_ID) prefillFromDashboard();
</script>
