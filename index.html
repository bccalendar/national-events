<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>National Event Request Form</title>
<style>
  :root{
    --bg-page:#f4f6f9; --card:#ffffff; --text-main:#1f2a37; --text-muted:#6b7280;
    --border:#e5e7eb; --primary:#d9534f; --primary-2:#c0392b; --accent:#2c3e50;
    --ok:#2e7d32; --focus:#2563eb; --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-page:#0f172a; --card:#1e293b; --text-main:#e5e7eb; --text-muted:#94a3b8;
      --border:#334155; --accent:#cbd5e1;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg-page);color:var(--text-main);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
  .wrap{max-width:860px;margin:0 auto;padding:24px 16px 60px}
  header.top{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  header.top img{height:44px;width:auto}
  h1{font-size:22px;margin:0;color:var(--accent)}
  .sub{color:var(--text-muted);font-size:13px;margin:2px 0 22px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 20px 8px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .card h2{font-size:15px;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field .req{color:var(--primary)}
  .field .help{font-size:12px;color:var(--text-muted);margin-top:4px}
  input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text-main);font-size:14px;font-family:inherit}
  textarea{min-height:84px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus),transparent 82%)}
  .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
  .chk{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:400;padding:8px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--card)}
  .chk input{margin-top:2px}
  .chk.sel{border-color:var(--focus);background:color-mix(in srgb,var(--focus),transparent 92%)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:620px){.row2{grid-template-columns:1fr}}
  .actions{display:flex;gap:12px;align-items:center;margin-top:8px}
  .btn{border:none;border-radius:8px;padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-2)}
  .btn[disabled]{opacity:.6;cursor:not-allowed}
  .err{color:var(--primary);font-size:12px;margin-top:4px;display:none}
  .field.invalid .err{display:block}
  .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--primary)}
  .banner{padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:16px;display:none}
  .banner.show{display:block}
  .banner.error{background:color-mix(in srgb,var(--primary),transparent 88%);color:var(--primary-2);border:1px solid var(--primary)}
  #successPanel{display:none;text-align:center;padding:40px 20px}
  #successPanel .big{font-size:40px}
  #successPanel h2{color:var(--ok)}
  #successPanel a.dash{display:inline-block;margin-top:14px;background:var(--primary);color:#fff;padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:600}
  .spin{display:none;width:18px;height:18px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .intro{background:color-mix(in srgb,var(--focus),transparent 92%);border-left:4px solid var(--focus);border-radius:8px;padding:14px 16px;margin-bottom:18px;font-size:13px;color:var(--text-main)}
  .intro p{margin:0 0 8px}
  .intro ol{margin:6px 0 0;padding-left:20px}
  .intro li{margin-bottom:6px}
  .section-note{font-size:12.5px;color:var(--text-muted);margin:-6px 0 14px}
  .chk-desc{font-size:11px;color:var(--text-muted);margin-top:3px;font-weight:400;line-height:1.35}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="https://balmoralaid-my.sharepoint.com/:i:/g/personal/bc_calendar_iicanada_net/IQDia9074O6nRoBnyx6CfOYUAVC5g3j_1K2iBRxSH-1A-qU?e=Ybmhls&download=1" alt="" onerror="this.style.display='none'">
    <div>
      <h1 id="formTitle">National Event Request Form</h1>
      <div class="sub" id="formSub">Submit a new event request for review and approval.</div>
    </div>
  </header>

  <div class="banner error" id="errorBanner"></div>
  <form id="eventForm" novalidate></form>

  <div id="successPanel">
    <div class="big">✅</div>
    <h2>Request submitted</h2>
    <p id="successMsg" style="color:var(--text-muted)"></p>
    <a class="dash" id="dashLink" href="#" target="_blank" rel="noopener">Open the Event Dashboard</a>
  </div>
</div>

<script>
/* ============================================================================
   1) SETTINGS
   ============================================================================ */
const FLOW_URL = "https://default98d027077ed646d2acf222ebdd2d5c.17.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/02/workflows/296063f569bc4eaf87cd4fa3e2d43cbb/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=i5srnnoXynkkmhK4IAlXhocTgvp_-tOHucExE59nBmY";
const DASHBOARD_URL = "";
const TIME_STEP = 15; // minutes between time options (set 30 for half-hour only)

/* ============================================================================
   2) OPTION LISTS  (values are what the flow stores — must match Region Config / SharePoint)
   ============================================================================ */
// region value MUST equal the Title in your Region Config list:
const REGIONS = [
  { label:"All Canada", value:"All Canada" },
  { label:"British Columbia", value:"British Columbia" },
  { label:"Edmonton", value:"Edmonton" },

  { label:"Southwest Ontario", value:"Southwest Ontario" },

// Region-specific intro shown once a Region is selected. Add other regions' text as needed.
const REGION_INTRO = {
  "British Columbia": `<p>Use this form to submit event requests to be Approved and added to the <strong>BC Institutional Calendar (BIC)</strong>. Please ensure that the event has been submitted a minimum of <strong>eight (8) weeks</strong> prior to the date of your event. This will allow the collaborating Board/Portfolios to provide the required support for the event in a timely manner.</p>
  <p>The approval process is as follows:</p>
  <ol>
    <li>Check the calendar ahead of submission for any location, time or target segment conflicts. Please try to resolve any conflicts with Boards/Portfolios ahead of submission, if possible.</li>
    <li>Submit your event using this form. This will generate an approval workflow to your Board/Portfolio Chair for Primary Approval, followed by Council for BC Honorary Secretary and/or ITREB for BC Honorary Secretary for Final Approval.</li>
    <li>If your event is approved, you will receive a confirmation email and it will be added to the BIC. You can then proceed with planning your event.</li>
    <li>If your event is not approved, you will receive an email with a comment explaining why the event was rejected. Once you have resolved this, you may resubmit a new request. If you need to add information regarding the resolution of the conflict or issue, use the 'Notes on Conflicts' field in the form.</li>

  "Southwest Ontario": `<p>Use this form to submit event requests to be Approved and added to the <strong>Council for Southwest Ontario Institutional Calendar (SWIC)</strong>. Please ensure that the event has been submitted a minimum of <strong>six (6) weeks</strong> prior to the date of your event. This will allow the collaborating Board/Portfolios to provide the required support for the event in a timely manner.</p>
  <p>The approval process is as follows:</p>
  <ol>
    <li>Check the calendar ahead of submission for any location, time or target segment conflicts. Please try to resolve any conflicts with Boards/Portfolios ahead of submission, if possible.</li>
    <li>Submit your event using this form. This will generate an approval workflow for Primary Approval, followed by Final Approval by the Institutional Delivery Excellence (IDE) Program Team.</li>
    <li>If your event is approved, you will receive a confirmation email and it will be added to the SWIC. You can then proceed with planning your event.</li>
    <li>If your event is not approved, you will receive an email with a comment explaining why the event was rejected. Once you have resolved this, you may resubmit a new request. If you need to add information regarding the resolution of the conflict or issue, use the 'Notes on Conflicts' field in the form.</li>

};

const BOARDS = [
  "Arts & Culture","ACCESS","Care for the Elderly (CFTE)","Communications & Publications","Community Assets",

  "Property Matters","Settlement","Aga Khan Social Welfare Board (SWB)","Volunteer Management",
  "Aga Khan Youth & Sports Board (YSB)","Equity Diversity Inclusion & Belonging","Aga Khan Development Network (AKDN)",
  "Aga Khan Foundation Canada (AKFC)","Aga Khan Museum (AKM)","Focus Canada","Global Encounters",
  "Global Centre for Pluralism (GCP)","World Partnership Golf","World Partnership Walk","Council for Canada"

const B_ITREB = "Ismaili Tariqah & Religious Education Board (ITREB)";
const B_YSB   = "Aga Khan Youth & Sports Board (YSB)";
// Boards that show NO Area of Focus / Objective:

const AOF_ITREB = ["Adult Education","BUI Early Childhood Development (ECD)","BUI Primary","BUI Secondary","Jamati Activities","Waezeen","Other"];

// NOTE: single Objective list for now. If you want objectives filtered by Area of Focus (as in Drupal),
// send me the per-area objective sub-lists and I'll wire objectivesBy(area).
const OBJECTIVES = [
  "Strengthen Ismaili identity (YSB) - Young Adult",
  "Strengthen Ismaili identity (YSB) - Youth",
  "Increase access to religious education for Adults 18+",
  "Increase access to religious education for ages 4-18 (BUI, ERP)",

// Per-region event-location lists:
const LOC_SWO = ["All Jamatkhanas","Brantford","Brampton","Guelph","Halton","Hamilton","Kitchener–Headquarters","London","Meadowvale","Mississauga","NiagaraFalls","Windsor","Other"];
const LOC_BC  = ["Ismaili Centre Vancouver Jamatkhana (Darkhana)","Headquarters Vancouver Jamatkhana","Richmond Jamatkhana","Burnaby Lake Jamatkhana","Tri-City Jamatkhana","Fraser Valley Jamatkhana","Downtown Jamatkhana","Other"];

  return ["Other"]; // add other regions' lists here as needed

const ATTENDEES = ["0 - 25","26 - 50","51 - 100","101 - 200","201 - 499","500+"];
const AUDIENCE = ["Jamat","Leadership","Ummah","External","Government","Other"];
const TARGET_SEGMENTS = ["Early Childhood Development (ECD) (0-4 yrs)","Young (5-11 yrs)","Youth (12-17 yrs)","Post Secondary (18-25 yrs)","Young Adults (25-35 yrs)","Adults (35-54 yrs)","Seniors (55+ yrs)","All"];
const SERVICES = [
  { label:"Arts & Culture", value:"Arts & Culture", desc:"Music, Bands, Performance Arts, Visual Arts, etc." },
  { label:"Communications", value:"Communications", desc:"Announcements, Communication & Marketing Plans, Digital Communications (iiCanada, Digital Al-Akhbar (DAA), Social Media, JamatKhana eBoards), Photos, Videos, Event Registration & Ticket Sales, etc." },
  { label:"Legal", value:"Legal", desc:"Waivers, Contracts, etc." },
  { label:"Audio Visual", value:"Audio Visual", desc:"Audio Visuals, Microphones, Speakers, Projector, Live Stream, etc." },
  { label:"Transportation", value:"Transportation", desc:"Material or People Transportation (Bus/Shuttle)." },
  { label:"Volunteer Management", value:"Volunteer Management", desc:"Event Resources (Setup, Takedown, Service, Food, Security, People Resources, etc.)." }
];
const EVENT_TYPES = ["Meeting","New Event","Program"];
const EVENT_LEADS = ["Requester is the Project Lead and Day Lead","Requester is the Project Lead, but the Day Lead is someone else","Project Lead and Day Leads are someone else"];
const EL_DPD = "Project Lead and Day Leads are someone else";
const EL_DDL = "Requester is the Project Lead, but the Day Lead is someone else";

/* ============================================================================
   3) FORM DEFINITION  (key = FormResponse key the flow expects)
   ============================================================================ */
const SECTIONS = [
  { title:"📅 Calendar Details", note:"This information is used to create the Institutional Calendar entry and room booking for your event.", fields:[
    { key:"Region", label:"Region", type:"select", required:true, options:REGIONS },
    { key:"Event Title", label:"Event Title", type:"text", required:true, help:"For a tentative booking, start the title with the word HOLD." },
    // Event Type is shown for all regions EXCEPT SWO (matches Drupal conditional):
    { key:"Event Type", label:"Event Type", type:"select", options:EVENT_TYPES,
      showIf:v=> v["Region"] && v["Region"]!==SWO },
    { key:"Event Description", label:"Event Description", type:"textarea", required:true },
    { key:"Event Start Date", label:"Event Start Date", type:"date", required:true },
    { key:"Start Time", label:"Start Time", type:"time", required:true, half:true, help:"Include the setup time you'll need." },
    { key:"End Time", label:"End Time", type:"time", required:true, half:true, help:"Include the takedown/cleanup time you'll need." },
    { key:"Recurring Event", label:"Is this a recurring event?", type:"select", required:true,
      options:["None","Daily","Weekly","Bi-Weekly","Monthly"] },
    { key:"Number Of Repeat Occurrences", label:"Number of Repeat Occurrences", type:"number", min:1, required:true,
      help:"How many times the event repeats (a number).",
      showIf:v=> v["Recurring Event"] && v["Recurring Event"]!=="None" },
    { key:"Virtual Event", label:"Will your event take place virtually?", type:"select", required:true,
      options:["No","Yes"] },
    { key:"Event Location", label:"Event Location", type:"select", required:true,
      optionsBy:v=> locationsFor(v["Region"]),
      showIf:v=> v["Virtual Event"]!=="Yes" },
    { key:"Venue Name", label:"Venue Name", type:"text", required:true, half:true,
      showIf:v=> v["Virtual Event"]!=="Yes" && v["Event Location"]==="Other" },
    { key:"Venue Address", label:"Venue Address", type:"textarea", required:true,
      showIf:v=> v["Virtual Event"]!=="Yes" && v["Event Location"]==="Other" },
    { key:"Notes on Conflicts", label:"Notes on Conflicts", type:"textarea",
      help:"Optional — if you had conflicts and resolved them, add notes for the approvers (e.g. \"resolved conflict with Board X for Event Y, please delete event Z\")." }
  ]},
  { title:"🎯 Event Details", fields:[
    { key:"Responsible Board", label:"Responsible Board / Portfolio", type:"select", required:true, options:BOARDS },
    { key:"Area of Focus", label:"Area of Focus", type:"select", required:true,
      help:"Enter the area of focus / sub-team for your Board/Portfolio.",
      optionsBy:v=> v["Responsible Board"]===B_ITREB ? AOF_ITREB : (v["Responsible Board"]===B_YSB ? AOF_YSB : AOF_OTHER),
      showIf:v=> v["Responsible Board"] && BOARDS_NO_AOF.indexOf(v["Responsible Board"])===-1 },
    { key:"Objective", label:"Objective", type:"select", required:true, options:OBJECTIVES,
      help:"The objective of this event for your Board/Portfolio.",
      showIf:v=> v["Responsible Board"] && BOARDS_NO_AOF.indexOf(v["Responsible Board"])===-1 },
    { key:"Audience", label:"Audience", type:"multiselect", required:true, options:AUDIENCE },
    // Target Segments only when Audience includes "Jamat":
    { key:"Target Segments", label:"Target Segments", type:"multiselect", required:true, options:TARGET_SEGMENTS,
      showIf:v=> Array.isArray(v["Audience"]) && v["Audience"].indexOf("Jamat")!==-1 },
    { key:"Collaborating Boards", label:"Collaborating Boards / Portfolios", type:"multiselect", options:BOARDS },
    { key:"Services needed", label:"Services Needed", type:"multiselect", required:true, options:SERVICES,
      help:"Select all the services you'll require for your event." },
    { key:"Expected Number of Attendees", label:"Expected Number of Attendees", type:"select", required:true, options:ATTENDEES },
    // ---- SWO-only fields (shown only when Region = Southwest Ontario) ----
    { key:"Serving Refreshments", label:"Are you serving refreshments?", type:"select", required:true, options:["No","Yes"],
      showIf:v=> v["Region"]===SWO },
    { key:"Refreshment Details", label:"Refreshment Details", type:"textarea", required:true,
      showIf:v=> v["Region"]===SWO && v["Serving Refreshments"]==="Yes" },
    { key:"Ticketed Event", label:"Does your event have tickets?", type:"select", required:true, options:["No","Yes","Yes (Subsidized)"],
      showIf:v=> v["Region"]===SWO },
    { key:"Ticket Price", label:"Ticket Price", type:"text", required:true,
      showIf:v=> v["Region"]===SWO && (v["Ticketed Event"]==="Yes" || v["Ticketed Event"]==="Yes (Subsidized)") },
    { key:"Has Budget", label:"Do you have budget for the event?", type:"select", required:true, options:["No","Yes"],
      showIf:v=> v["Region"]===SWO },
    { key:"Cost Breakdown", label:"Please provide a cost breakdown for the event", type:"textarea", required:true,
      showIf:v=> v["Region"]===SWO && v["Has Budget"]==="Yes" }
  ]},
  { title:"👤 Contact Details", note:"This information is used for the Institutional Calendar entry and event coordination.", fields:[
    { key:"Name", label:"Your Name", type:"text", required:true, half:true },
    { key:"Email Address", label:"Your Email", type:"email", required:true, validate:"email", half:true },
    { key:"Phone Number", label:"Your Phone", type:"tel", required:true, validate:"phone", half:true },
    { key:"Event Leads", label:"Event Leads", type:"select", required:true, options:EVENT_LEADS },
    // Project Lead: only when "Project Lead and Day Leads are someone else"
    { key:"Project Lead Name", label:"Project Lead Name", type:"text", required:true, half:true,
      showIf:v=> v["Event Leads"]===EL_DPD },
    { key:"Project Lead Email", label:"Project Lead Email", type:"email", required:true, validate:"email", half:true,
      showIf:v=> v["Event Leads"]===EL_DPD },
    { key:"Project Lead Phone", label:"Project Lead Phone", type:"tel", validate:"phone", half:true,
      showIf:v=> v["Event Leads"]===EL_DPD },
    // Day-of Lead: when day lead is someone else (both "ddl" and "dpd")
    { key:"Day of Event Lead Name", label:"Day-of Lead Name", type:"text", required:true, half:true,
      showIf:v=> v["Event Leads"]===EL_DDL || v["Event Leads"]===EL_DPD },
    { key:"Day of Event Lead Email", label:"Day-of Lead Email", type:"email", required:true, validate:"email", half:true,
      showIf:v=> v["Event Leads"]===EL_DDL || v["Event Leads"]===EL_DPD },
    { key:"Day of Event Lead Phone", label:"Day-of Lead Phone", type:"tel", validate:"phone", half:true,
      showIf:v=> v["Event Leads"]===EL_DDL || v["Event Leads"]===EL_DPD }
  ]}
];
const ARRAY_KEYS = ["Room Booking","Audience","Target Segments","Collaborating Boards","Services needed"];

/* ============================================================================
   4) ENGINE
   ============================================================================ */
const q = new URLSearchParams(location.search);
const EDIT_ID = q.get('eid') || q.get('eventid') || '';
const PRESET_REGION = q.get('region') || q.get('r') || '';
const form = document.getElementById('eventForm');
const values = {};
const fieldEls = {};
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function el(tag, attrs, html){ const e=document.createElement(tag); if(attrs) for(const k in attrs) e.setAttribute(k,attrs[k]); if(html!=null) e.innerHTML=html; return e; }
const norm = o => (typeof o==='string' ? {label:o, value:o} : o);
function buildTimeOptions(){ const out=[]; for(let h=0;h<24;h++){ for(let m=0;m<60;m+=TIME_STEP){ const ap=h>=12?'pm':'am'; let h12=h%12; if(h12===0)h12=12; out.push(h12+':'+String(m).padStart(2,'0')+' '+ap); } } return out; }
const TIME_OPTIONS = buildTimeOptions();
function validPhone(s){ const d=String(s||'').replace(/\D/g,''); return /^1?\d{10}$/.test(d); }

function buildField(def){
  const wrap = el('div',{class:'field','data-key':def.key});
  const id = 'f_'+def.key.replace(/[^a-z0-9]/gi,'_');
  wrap.appendChild(el('label',{for:id}, def.label + (def.required?' <span class="req">*</span>':'')));
  let rebuild = null;

  if(def.type==='select' || def.type==='time'){
    const s = el('select',{id});
    const getOpts = ()=> def.type==='time' ? TIME_OPTIONS : (def.optionsBy ? def.optionsBy(values) : (def.options||[]));
    const fill = ()=>{
      const cur = values[def.key]||'';
      s.innerHTML=''; s.appendChild(el('option',{value:''},'— Select —'));
      const list = getOpts().map(norm);
      list.forEach(o=> s.appendChild(el('option',{value:o.value}, o.label)));
      if(list.some(o=>o.value===cur)){ s.value=cur; } else { s.value=''; values[def.key]=''; }
    };
    fill();
    s.addEventListener('change',()=>{ values[def.key]=s.value; onChange(); });
    if(def.optionsBy) rebuild = fill;
    wrap.appendChild(s);
  } else if(def.type==='multiselect'){
    values[def.key]=[];
    const box = el('div',{class:'checks'});
    (def.options||[]).map(norm).forEach(o=>{
      const lab = el('label',{class:'chk'});
      const cb = el('input',{type:'checkbox',value:o.value});
      cb.addEventListener('change',()=>{
        const arr = values[def.key];
        if(cb.checked){ if(arr.indexOf(o.value)===-1) arr.push(o.value); lab.classList.add('sel'); }
        else { values[def.key]=arr.filter(x=>x!==o.value); lab.classList.remove('sel'); }
        onChange();
      });
      lab.appendChild(cb);
      const txt = el('div'); txt.appendChild(document.createTextNode(o.label));
      if(o.desc) txt.appendChild(el('div',{class:'chk-desc'}, o.desc));
      lab.appendChild(txt);
      box.appendChild(lab);
    });
    wrap.appendChild(box);
  } else if(def.type==='textarea'){
    const t = el('textarea',{id});
    t.addEventListener('input',()=>{ values[def.key]=t.value; });
    wrap.appendChild(t);
  } else {
    const inp = el('input',{id,type:def.type||'text'});
    if(def.type==='number' && def.min!=null) inp.setAttribute('min', def.min);
    inp.addEventListener('input',()=>{ values[def.key]=inp.value; });
    wrap.appendChild(inp);
  }
  wrap.appendChild(el('div',{class:'err'},'This field is required.'));
  if(def.help) wrap.appendChild(el('div',{class:'help'}, def.help));
  fieldEls[def.key]={wrap, def, rebuild};
  return wrap;
}

function renderForm(){
  form.appendChild(el('div',{class:'intro',id:'regionIntro',hidden:'hidden'}));
  SECTIONS.forEach(sec=>{
    const card = el('div',{class:'card'});
    card.appendChild(el('h2',null, sec.title));
    if(sec.note) card.appendChild(el('div',{class:'section-note'}, sec.note));
    let rowBuf=[];
    const flush=()=>{ if(rowBuf.length){ const r=el('div',{class:'row2'}); rowBuf.forEach(f=>r.appendChild(f)); card.appendChild(r); rowBuf=[]; } };
    sec.fields.forEach(def=>{
      const w = buildField(def);
      if(def.half){ rowBuf.push(w); if(rowBuf.length===2) flush(); }
      else { flush(); card.appendChild(w); }
    });
    flush();
    form.appendChild(card);
  });
  const act = el('div',{class:'actions'});
  act.appendChild(el('button',{type:'submit',class:'btn btn-primary',id:'submitBtn'}, EDIT_ID?'Save Changes':'Submit Request'));
  act.appendChild(el('div',{class:'spin',id:'spin'}));
  form.appendChild(act);
}

function visible(def){
  if(def.regions && def.regions.indexOf(values["Region"])===-1) return false;
  if(def.showIf && !def.showIf(values)) return false;
  return true;
}
function updateRegionIntro(){
  const box = document.getElementById('regionIntro'); if(!box) return;
  const t = REGION_INTRO[values["Region"]];
  if(t){ box.innerHTML = t; box.hidden = false; } else { box.innerHTML=''; box.hidden = true; }
}
function onChange(){
  for(const key in fieldEls){ if(fieldEls[key].rebuild) fieldEls[key].rebuild(); }
  for(const key in fieldEls){ fieldEls[key].wrap.hidden = !visible(fieldEls[key].def); }
  updateRegionIntro();
}

function setErr(wrap, msg){ wrap.classList.add('invalid'); const e=wrap.querySelector('.err'); if(e&&msg) e.textContent=msg; }
function validate(){
  let ok=true, first=null;
  for(const key in fieldEls){
    const {wrap,def}=fieldEls[key];
    wrap.classList.remove('invalid');
    if(wrap.hidden) continue;
    const v = values[key];
    const empty = Array.isArray(v)? v.length===0 : !String(v==null?'':v).trim();
    if(def.required && empty){ setErr(wrap,'This field is required.'); ok=false; first=first||wrap; continue; }
    if(!empty && def.validate==='email' && !EMAIL_RE.test(String(v).trim())){ setErr(wrap,'Enter a valid email address.'); ok=false; first=first||wrap; continue; }
    if(!empty && def.validate==='phone' && !validPhone(v)){ setErr(wrap,'Enter a valid North American phone number (10 digits).'); ok=false; first=first||wrap; continue; }
    if(!empty && def.type==='number' && def.min!=null && Number(v)<def.min){ setErr(wrap,'Value must be at least '+def.min+'.'); ok=false; first=first||wrap; continue; }
  }
  if(first) first.scrollIntoView({behavior:'smooth',block:'center'});
  return ok;
}

function buildPayload(){
  const fr = { "Event Id": EDIT_ID || "", "Id": EDIT_ID? parseInt(EDIT_ID,10):0 };
  for(const key in fieldEls){
    const {wrap,def}=fieldEls[key];
    let v = values[key];
    if(wrap.hidden){ v = (def.type==='multiselect')? [] : ''; }
    if(def.type==='multiselect'){ fr[key] = Array.isArray(v)? v : []; }
    else { fr[key] = v==null? '' : String(v); }
  }
  ARRAY_KEYS.forEach(k=>{ if(!(k in fr)) fr[k]=[]; });
  return { FormResponse: fr };
}

async function submit(e){
  e.preventDefault();
  document.getElementById('errorBanner').classList.remove('show');
  if(!validate()){ showError('Please fix the highlighted fields.'); return; }
  if(FLOW_URL.indexOf('http')!==0){ showError('Form endpoint not configured yet — set FLOW_URL in index.html.'); return; }
  const btn=document.getElementById('submitBtn'), spin=document.getElementById('spin');
  btn.disabled=true; spin.style.display='inline-block';
  try{
    const r = await fetch(FLOW_URL, { method:'POST', body: JSON.stringify(buildPayload()) }); // text/plain => no CORS preflight
    const txt = await r.text();
    let data={}; try{ data=JSON.parse(txt); }catch(_){}
    if(!r.ok) throw new Error('HTTP '+r.status+' '+txt.slice(0,200));
    showSuccess(data);
  }catch(err){ showError('Could not submit: '+err.message); btn.disabled=false; spin.style.display='none'; }
}

function showError(msg){ const b=document.getElementById('errorBanner'); b.textContent=msg; b.classList.add('show'); window.scrollTo({top:0,behavior:'smooth'}); }
function showSuccess(data){
  form.style.display='none';
  const sp=document.getElementById('successPanel'); sp.style.display='block';
  document.getElementById('successMsg').textContent = data.eventId ? ('Your request has been received (Event #'+data.eventId+') and is now in the approval workflow.') : 'Your request has been received and is now in the approval workflow.';
  const link=document.getElementById('dashLink');
  if(data.dashboardUrl){ link.href=data.dashboardUrl; } else { link.style.display='none'; }
  window.scrollTo({top:0,behavior:'smooth'});
}

renderForm();
if(EDIT_ID){ document.getElementById('formTitle').textContent='Edit Event Request';
  document.getElementById('formSub').textContent='Editing event #'+EDIT_ID+'. Material changes (date, time, location, etc.) will re-enter approval.'; }
if(PRESET_REGION){ values["Region"]=PRESET_REGION; const sel=document.getElementById('f_Region'); if(sel) sel.value=PRESET_REGION; }
onChange();
form.addEventListener('submit', submit);
</script>
</body>
